spring:
  application:
    name: BaseProject
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_hub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET:eventhub-dev-only-secret-key-2026-doi-truoc-khi-deploy}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
