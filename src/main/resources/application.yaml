spring:
  application:
    name: BaseProject
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_thaitruong?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      # Cao hơn giới hạn từng feature để validator trả đúng mã lỗi nghiệp vụ.
      max-file-size: 16MB
      max-request-size: 17MB

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
      chat:
        timeout: ${AI_TIMEOUT:25s}
        max-retries: ${AI_MAX_RETRIES:0}
        options:
          model: ${AI_MODEL:minimax/minimax-m3:free}
          temperature: ${AI_TEMPERATURE:0.1}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    with-credentials: true
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:eventhub-dev-only-secret-key-2026-doi-truoc-khi-deploy}
    expiration-ms: ${JWT_EXPIRATION_MS:9000000}

  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
    cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    # only auth apis need cookie
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:1063418979323-9esrkg9ef25jofnrjrrkdgcduhaffaia.apps.googleusercontent.com}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket-name: ${STORAGE_BUCKET_NAME:interview-store}
    region: ${STORAGE_REGION:us-east-1}

  cv:
    max-file-size-bytes: ${CV_MAX_FILE_SIZE_BYTES:5242880}
    max-pages: ${CV_MAX_PAGES:10}
    max-per-user: ${CV_MAX_PER_USER:10}

  job-description:
    max-file-size-bytes: ${JD_MAX_FILE_SIZE_BYTES:5242880}
    max-pages: ${JD_MAX_PAGES:20}
    max-per-user: ${JD_MAX_PER_USER:50}
    max-text-characters: ${JD_MAX_TEXT_CHARACTERS:30000}

  interview-session:
    supported-languages: ${INTERVIEW_SUPPORTED_LANGUAGES:vi,en}
    supported-durations: ${INTERVIEW_SUPPORTED_DURATIONS:15,30,45,60}
    deadline-sweep-ms: ${INTERVIEW_DEADLINE_SWEEP_MS:30000}

  interview-scoring:
    minimum-coverage-percentage: ${INTERVIEW_MINIMUM_SCORING_COVERAGE:50}
    technical-weight: ${INTERVIEW_TECHNICAL_SCORE_WEIGHT:0.8}
    communication-weight: ${INTERVIEW_COMMUNICATION_SCORE_WEIGHT:0.2}
