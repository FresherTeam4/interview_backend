spring:
  application:
    name: BaseProject
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    with-credentials: true
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:eventhub-dev-only-secret-key-2026-doi-truoc-khi-deploy}
    expiration-ms: ${JWT_EXPIRATION_MS:9000000}
  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
    cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    # only auth apis need cookie
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:1063418979323-9esrkg9ef25jofnrjrrkdgcduhaffaia.apps.googleusercontent.com}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
  cv:
    max-file-size-bytes: ${CV_MAX_FILE_SIZE_BYTES:5242880}
    max-pages: ${CV_MAX_PAGES:10}
    max-per-user: ${CV_MAX_PER_USER:10}
  jd:
    min-text-chars: ${JD_MIN_TEXT_CHARS:100}
    max-text-chars: ${JD_MAX_TEXT_CHARS:50000}
    max-per-user: ${JD_MAX_PER_USER:30}
    max-file-size-bytes: ${JD_MAX_FILE_SIZE_BYTES:2097152}
    max-pages: ${JD_MAX_PAGES:20}
  interview:
    enabled: ${INTERVIEW_ENABLED:true}
    recovery-cron: ${INTERVIEW_RECOVERY_CRON:30 */2 * * * *}
    processing-lease-seconds: ${INTERVIEW_PROCESSING_LEASE_SECONDS:90}
    max-active-per-user: ${INTERVIEW_MAX_ACTIVE_PER_USER:5}
    max-answer-chars: ${INTERVIEW_MAX_ANSWER_CHARS:10000}
    questions:
      easy: ${INTERVIEW_EASY_QUESTIONS:5}
      medium: ${INTERVIEW_MEDIUM_QUESTIONS:6}
      hard: ${INTERVIEW_HARD_QUESTIONS:7}
    ai:
      model: ${INTERVIEW_AI_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
      script-prompt-version: ${INTERVIEW_SCRIPT_PROMPT_VERSION:v1}
      follow-up-prompt-version: ${INTERVIEW_FOLLOW_UP_PROMPT_VERSION:v1}
      script-timeout-ms: ${INTERVIEW_SCRIPT_TIMEOUT_MS:12000}
      follow-up-timeout-ms: ${INTERVIEW_FOLLOW_UP_TIMEOUT_MS:8000}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:interview-cv}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    presign-ttl-seconds: ${STORAGE_PRESIGN_TTL_SECONDS:300}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    schema-version: ${GEMINI_SCHEMA_VERSION:v1}
    timeout-ms: ${GEMINI_TIMEOUT_MS:25000}
