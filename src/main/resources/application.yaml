spring:
  application:
    name: BaseProject
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  # ---- Timeout cho RestClient (Spring AI dùng RestClient mặc định của Boot) ----
  http:
    client:
      connect-timeout: 10s
      read-timeout: 120s
  # ---- Cấu hình AI (Spring AI) - Đa mô hình ----
  ai:
    # Primary Model: OpenAI
    openai:
      api-key: ${PRIMARY_AI_KEY:dummy-openai-key}
      chat:
        options:
          model: ${PRIMARY_AI_MODEL:gpt-4o}
    # Fallback Model: Gemini
    google:
      genai:
        api-key: ${FALLBACK_AI_KEY:dummy-gemini-key}
        chat:
          options:
            model: ${FALLBACK_AI_MODEL:gemini-3.5-flash-lite}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    with-credentials: true
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:eventhub-dev-only-secret-key-2026-doi-truoc-khi-deploy}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
    cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:1063418979323-9esrkg9ef25jofnrjrrkdgcduhaffaia.apps.googleusercontent.com}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
  cv:
    storage:
      dir: ${CV_STORAGE_DIR:./data/cv}
      max-file-size-bytes: ${CV_MAX_FILE_SIZE_BYTES:5242880}

# ---- Cấu hình Retry & Fallback (Resilience4j) ----
resilience4j.retry:
  instances:
    cvParseRetry:
      maxAttempts: 2
      waitDuration: 2s
      retryExceptions:
        - java.lang.RuntimeException

