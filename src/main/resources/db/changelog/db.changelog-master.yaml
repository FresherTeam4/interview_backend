databaseChangeLog:
  # MARK_RAN cho phép Liquibase tiếp quản database cũ đã được Hibernate tạo.
  # Database mới vẫn chạy đầy đủ schema theo đúng thứ tự phụ thuộc.
  - changeSet:
      id: 000-core-schema
      author: my-interview-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_accounts
      changes:
        - sqlFile:
            path: db/changelog/000-core-schema.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 001-interview-templates
      author: my-interview-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: job_description_documents
      changes:
        - sqlFile:
            path: db/changelog/sql/001-interview-templates.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 002-interview-sessions
      author: my-interview-team
      preConditions:
        - onFail: MARK_RAN
